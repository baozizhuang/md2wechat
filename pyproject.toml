[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md2wechat"
version = "0.1.0"
description = "把 Markdown 转成可直接粘贴进微信公众号编辑器的排版 HTML（全内联样式，不丢格式）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "baozizhuang" }]
keywords = ["wechat", "markdown", "mp-weixin", "公众号", "排版"]
dependencies = [
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/baozizhuang/md2wechat"
Issues = "https://github.com/baozizhuang/md2wechat/issues"
Changelog = "https://github.com/baozizhuang/md2wechat/blob/main/CHANGELOG.md"

[project.scripts]
md2wechat = "md2wechat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
